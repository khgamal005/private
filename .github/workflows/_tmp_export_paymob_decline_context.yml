name: Temporary export Paymob decline context
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_tmp_export_paymob_decline_context.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: paymob-decline-context
          retention-days: 1
          if-no-files-found: error
          path: |
            supabase/functions/paymob-reconcile/index.ts
            supabase/functions/paymob-webhook/index.ts
            supabase/functions/paymob-checkout/index.ts
            app/api/payments/paymob/return/route.js
            app/api/payments/paymob/status/route.js
            components/paymob-return-status.js
            supabase/config.toml
            supabase/migrations/20260901134621_paymob_intention_checkout_v1.sql
            supabase/migrations/20260903203000_paymob_quicklink_checkout_options_v1.sql
            tests/paymob-reconciliation.test.mjs
            tests/paymob-webhook.test.mjs
            tests/paymob-return-route.test.mjs
