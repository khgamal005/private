name: Academy real Storage upload
on:
  pull_request:
    paths:
      - '.github/workflows/academy-storage.yml'
      - 'app/api/academy-media/**'
      - 'lib/academy-media*'
      - 'components/academy-video*'
      - 'scripts/academy-storage-fixture.mjs'
      - 'tests/academy-storage*.test.mjs'
      - 'tests/fixtures/academy-*'
      - 'tests/fixtures/training-journey-*'
      - 'supabase/migrations/**'
permissions:
  contents: read
jobs:
  storage-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: academy_ci_disposable
          POSTGRES_DB: academy_storage
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_storage"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ACADEMY_STORAGE_TEST_DATABASE_URL: postgres://postgres:academy_ci_disposable@127.0.0.1:5432/academy_storage
      ACADEMY_STORAGE_TEST_URL: http://127.0.0.1:5050/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts pg@8.16.3
      - run: git diff --exit-code -- package.json package-lock.json
      - run: node scripts/academy-storage-fixture.mjs
      - name: Start the pinned official Storage service
        run: docker run -d --name academy-storage-ci --network host --env-file /tmp/academy-storage-ci.env supabase/storage-api:v1.74.0
      - name: Exercise actual upload, resume, signing, playback and authorization
        run: node --test tests/academy-storage-runtime.test.mjs
      - name: Storage diagnostics on failure
        if: failure()
        run: docker logs --tail 100 academy-storage-ci
      - name: Dispose of the test service
        if: always()
        run: docker rm -f academy-storage-ci
