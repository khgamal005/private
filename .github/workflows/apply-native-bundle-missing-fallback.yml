name: Apply native bundle missing fallback

on:
  push:
    branches:
      - agent/fix-native-bundle-missing-fallback
    paths:
      - scripts/patch-native-bundle-missing-fallback.mjs
      - .github/workflows/apply-native-bundle-missing-fallback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-native-bundle-missing-fallback
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply recovery patch
        run: node scripts/patch-native-bundle-missing-fallback.mjs
      - name: Commit implementation
        run: |
          git config user.name "Marktone Builder Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/cms/templates/native/route.js lib/cms-native-template-client.js components/template-import-mode-provider.js components/use-page-builder.js components/page-builder-with-library.js package.json package-lock.json tests/cms-native-bundle-fallback.test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Recover missing native template bundles"
            git push origin HEAD:agent/fix-native-bundle-missing-fallback
          fi
