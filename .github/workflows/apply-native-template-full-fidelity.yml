name: Apply native template full fidelity

on:
  push:
    branches:
      - agent/native-template-full-fidelity
    paths:
      - scripts/patch-native-template-full-fidelity.mjs
      - .github/workflows/apply-native-template-full-fidelity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-template-full-fidelity
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply full-fidelity patch
        run: node scripts/patch-native-template-full-fidelity.mjs
      - name: Commit implementation
        run: |
          git config user.name "Marktonesa"
          git config user.email "ceo@ifese.eu"
          git add lib/cms-native-template-client.js components/native-template-section.js components/page-builder-with-library.js package.json package-lock.json tests
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Restore native template media and scriptless content"
            git push origin HEAD:agent/native-template-full-fidelity
          fi
