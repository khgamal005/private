name: Apply native template layout and deletion fixes

on:
  push:
    branches:
      - agent/fix-native-template-layout-delete
    paths:
      - scripts/apply-native-template-layout-delete.mjs
      - scripts/native-template-layout-delete-ops.json
      - .github/workflows/apply-native-template-layout-delete.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-native-template-layout-delete
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply template patches
        run: node scripts/apply-native-template-layout-delete.mjs
      - name: Commit integrated implementation
        run: |
          git config user.name "Marktone Builder Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix native template full-page layout and library deletion"
          git push origin HEAD:agent/fix-native-template-layout-delete
