name: Build Paymob decline reconciliation and UX

on:
  push:
    branches:
      - fix/paymob-decline-reconciliation-ux-20260905
    paths:
      - .github/workflows/build-paymob-decline-reconciliation-v1.yml

permissions:
  contents: write

concurrency:
  group: paymob-decline-reconciliation-v1
  cancel-in-progress: false

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paymob-decline-reconciliation-ux-20260905
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply deterministic patch
        run: python3 .github/scripts/apply-paymob-decline-reconciliation-v1.py

      - name: Prove bounded change surface
        shell: bash
        run: |
          set -euo pipefail
          changed="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"
          expected="$(printf '%s\n' \
            app/api/payments/paymob/status/route.js \
            components/paymob-return-status.js \
            supabase/functions/paymob-reconcile/index.ts \
            tests/paymob-decline-reconciliation-v1.test.mjs | sort)"
          test "$changed" = "$expected" || {
            echo 'Unexpected patch surface:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          test -s supabase/migrations/20260905213000_paymob_decline_reconciliation_v1.sql

      - name: Install immutable dependencies
        run: npm ci

      - name: Run complete quality gate
        run: npm run check

      - name: Reject critical dependency advisories
        run: npm audit --audit-level=critical

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/build-paymob-decline-reconciliation-v1.yml \
            .github/scripts/apply-paymob-decline-reconciliation-v1.py
          git add \
            app/api/payments/paymob/status/route.js \
            components/paymob-return-status.js \
            supabase/functions/paymob-reconcile/index.ts \
            supabase/migrations/20260905213000_paymob_decline_reconciliation_v1.sql \
            tests/paymob-decline-reconciliation-v1.test.mjs
          git commit -m 'fix(paymob): reconcile declines and simplify recovery'
          git push origin HEAD:fix/paymob-decline-reconciliation-ux-20260905
