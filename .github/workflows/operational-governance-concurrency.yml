name: Operational governance concurrency

on:
  pull_request:
    paths:
      - '.github/workflows/operational-governance-concurrency.yml'
      - 'supabase/migrations/*governance*'
      - 'supabase/migrations/*operating_foundation*'
      - 'tests/operational-governance-*.test.mjs'
      - 'tests/fixtures/operational-governance-*'
      - 'tests/fixtures/financial-governance-*'
      - 'tests/fixtures/training-journey-*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-governance-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: governance_ci
          POSTGRES_PASSWORD: governance_ci_password
          POSTGRES_DB: governance_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U governance_ci -d governance_concurrency"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Disposable loopback service credentials only. No deployment/app secrets.
      GOVERNANCE_TEST_DATABASE_URL: postgres://governance_ci:governance_ci_password@127.0.0.1:5432/governance_concurrency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install isolated PostgreSQL test driver
        run: npm install --no-save --package-lock=false --ignore-scripts pg@8.16.3
      - name: Verify dependency manifests remain unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Exercise actual simultaneous governance transactions
        run: node --test tests/operational-governance-concurrency.test.mjs
