name: Build Paymob automatic all-tenant rollout v2

on:
  push:
    branches:
      - feat/paymob-auto-all-tenants-20260905
    paths:
      - .github/workflows/paymob-auto-all-tenants-build-v2.yml

permissions:
  contents: write

concurrency:
  group: paymob-auto-all-tenants-build-v2
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paymob-auto-all-tenants-20260905
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply bounded UI, API and governance-test updates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one target, found {count}')
              return text.replace(old, new, 1)

          def replace_between(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker missing')
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f'{label}: end marker missing')
              return text[:start] + replacement + text[end:]

          api_path = Path('app/api/platform/paymob-control/route.js')
          api = api_path.read_text(encoding='utf-8')
          api = replace_once(
              api,
              "    active:value.active===true,\n    nativeAdapterDeployed:value.nativeAdapterDeployed===true,",
              "    active:value.active===true,\n    automaticTenantEnrollment:value.automaticTenantEnrollment===true,\n    controlledLiveActive:value.controlledLiveActive===true,\n    nativeAdapterDeployed:value.nativeAdapterDeployed===true,",
              'Paymob snapshot sanitizer',
          )
          api_path.write_text(api, encoding='utf-8')

          ui_path = Path('components/platform-addon-console.js')
          ui = ui_path.read_text(encoding='utf-8')
          ui = replace_once(
              ui,
              "      if(!UUID.test(tenantId)||tenantSlug==='reef-skills'\n         ||tenantKey==='tenant-reef-skills')continue;",
              "      if(!UUID.test(tenantId))continue;",
              'tenant list inclusion',
          )
          ui = replace_once(
              ui,
              "  const [tenantId,setTenantId]=useState('');\n  const [environment,setEnvironment]=useState('sandbox');",
              "  const [tenantId,setTenantId]=useState('');\n  const [environment,setEnvironment]=useState('live');",
              'default rollout environment',
          )
          ui = replace_once(
              ui,
              "  const globalReady=snapshot.rolloutMode===environment&&(\n    environment==='sandbox'\n      ?snapshot.status==='configured'\n      :snapshot.status==='active'&&snapshot.active===true\n  );",
              "  const globalReady=(\n    environment==='live'&&snapshot.controlledLiveActive===true\n  )||snapshot.rolloutMode===environment&&(\n    environment==='sandbox'\n      ?snapshot.status==='configured'\n      :snapshot.status==='active'&&snapshot.active===true\n  );",
              'effective global readiness',
          )
          ui = replace_once(
              ui,
              "      <div><small>SINGLE AUTHORIZED OPERATOR</small><h2>تشغيل Paymob</h2>\n        <p>أي منفّذ يملك صلاحية إدارة الفوترة يستطيع إكمال الإجراء مباشرة. تبقى الأدلة والتأكيد الحرفي وسجل التدقيق إلزامية.</p>",
              "      <div><small>SINGLE AUTHORIZED OPERATOR · AUTOMATIC TENANT ENROLLMENT</small><h2>تشغيل Paymob</h2>\n        <p>{snapshot.automaticTenantEnrollment\n          ?'Paymob متاح تلقائيًا لكل المنشآت الحالية والجديدة، مع إمكانية إيقافه لمنشأة بعينها وسجل تدقيق كامل. منفّذ واحد يملك الصلاحية يدير الاستثناء مباشرة.'\n          :'أي منفّذ يملك صلاحية إدارة الفوترة يستطيع إكمال الإجراء مباشرة. تبقى الأدلة والتأكيد الحرفي وسجل التدقيق إلزامية.'}</p>",
              'governance header',
          )
          ui = replace_once(
              ui,
              "      <article>\n        <h3>إتاحة المنشآت</h3>\n        <label>المنشأة<select value={tenantId}",
              "      <article>\n        <h3>إتاحة المنشآت</h3>\n        {snapshot.automaticTenantEnrollment&&<aside className={styles.safety}>كل المنشآت الحالية والجديدة تُضاف تلقائيًا إلى Paymob Live. يبقى الإيقاف الفردي متاحًا كاستثناء تشغيلي.</aside>}\n        <label>المنشأة<select value={tenantId}",
              'automatic enrollment banner',
          )
          ui = replace_once(
              ui,
              "          <div><dt>حالة المنشأة</dt><dd>{tenantRollout?.status||'غير مفعّلة'}</dd></div>",
              "          <div><dt>حالة المنشأة</dt><dd>{tenantRollout?.status||(snapshot.automaticTenantEnrollment?'مفعّلة تلقائيًا':'غير مفعّلة')}</dd></div>",
              'effective tenant status',
          )
          ui = replace_once(
              ui,
              "        <small className={styles.governanceNote}>Reef Skills مستبعد خادميًا ومن القائمة. وضع تحقق Live يقتصر على مركز أودير النموذجي وبحد 500 ر.س للطلب.</small>",
              "        <small className={styles.governanceNote}>الإتاحة التلقائية تشمل كل المنشآت القديمة والجديدة. يمكن إيقاف منشأة محددة يدويًا دون التأثير على بقية المنشآت.</small>",
              'rollout policy note',
          )
          ui_path.write_text(ui, encoding='utf-8')

          admin_path = Path('tests/paymob-admin-governance.test.mjs')
          admin = admin_path.read_text(encoding='utf-8')
          admin_start = "test('operator UI exposes one-step authorized actions while retaining hard safety gates',()=>{"
          admin_end = "test('operational evidence is digest-only"
          admin_replacement = r'''test('operator UI exposes one-step authorized actions while retaining hard safety gates',()=>{
            assert.match(ui,/fetch\(\s*['"]\/api\/platform\/paymob-control['"][\s\S]{0,120}?method\s*:\s*['"]GET['"][\s\S]{0,100}?cache\s*:\s*['"]no-store['"]/i);
            assert.match(ui,/fetch\(\s*['"]\/api\/platform\/paymob-control['"][\s\S]{0,120}?method\s*:\s*['"]POST['"]/i);
            assert.match(ui,/typed\s*!==\s*modal\.expected[\s\S]*?return/i);
            assert.match(ui,/body\s*:\s*JSON\.stringify\(\{\.\.\.modal\.request,confirmation:typed\}\)/i);

            assert.match(ui,/action:['"]global_activate['"]/i);
            assert.match(ui,/ACTIVATE PAYMOB\s+\$\{targetMode\.toUpperCase\(\)\}/i);
            assert.match(ui,/disabled=\{[\s\S]*?!snapshot\.liveReady\|\|snapshot\.liveGateBlocked/i);
            assert.match(ui,/action:enabled\?['"]tenant_enable['"]:['"]tenant_disable['"]/i);
            assert.match(ui,/ENABLE PAYMOB TENANT\s+\$\{tenant\.id\}/i);
            assert.match(ui,/action:['"]evidence_attest['"]/i);
            assert.match(ui,/ATTEST PAYMOB EVIDENCE/i);
            assert.match(ui,/SINGLE AUTHORIZED OPERATOR/i);
            assert.match(ui,/منفّذ واحد يملك الصلاحية/i);
            assert.doesNotMatch(ui,/global_approve|tenant_approve|evidence_approve|maker[–-]checker|مراجع مختلف|مشغّل آخر/i);

            assert.doesNotMatch(ui,/tenantSlug===['"]reef-skills['"]|tenantKey===['"]tenant-reef-skills['"]/i);
            assert.match(ui,/automaticTenantEnrollment/i);
            assert.match(ui,/controlledLiveActive/i);
            assert.match(ui,/كل المنشآت الحالية والجديدة/i);
            assert.match(ui,/إيقاف المنشأة/i);
            assert.doesNotMatch(ui,/500 ر\.س|Reef Skills مستبعد/i);

            for(const checkKey of [
              'refund_inquiry','reconciler_schedule','outbox_delivery',
              'live_card_integration_callback'
            ])assert.match(
              ui,
              new RegExp('\\b'+checkKey+'\\s*:'),
              'Missing Arabic operator label for '+checkKey
            );
          });

          '''
          admin = replace_between(
              admin, admin_start, admin_end, admin_replacement,
              'Paymob operator governance test',
          )
          admin_path.write_text(admin, encoding='utf-8')

          live_path = Path('tests/paymob-live-validation-v2.test.mjs')
          live = live_path.read_text(encoding='utf-8')
          import_anchor = """const singleOperatorMigration=read(
            'supabase/migrations/20260904223000_single_authorized_operator_policy_v1.sql'
          );
          """
          live = replace_once(
              live,
              import_anchor,
              import_anchor + """const automaticRolloutMigration=read(
            'supabase/migrations/20260905170000_paymob_automatic_all_tenants_v1.sql'
          );
          """,
              'automatic rollout migration test import',
          )
          live_start = "test('Live validation is one single-operator non-Reef model tenant with a SAR 500 cap',()=>{"
          live_end = "test('canonical Live events"
          live_replacement = r'''test('controlled Live automatically enrolls every existing and future tenant',()=>{
            assert.match(automaticRolloutMigration,/paymob_controlled_live_provider_ready_v1/i);
            assert.match(automaticRolloutMigration,/paymob_required_secret_refs_valid_v2[\s\S]*?'quicklink'/i);
            assert.match(automaticRolloutMigration,/paymob_live_credential_material_valid_v2[\s\S]*?'quicklink'/i);
            assert.match(automaticRolloutMigration,/create\s+trigger\s+zz_tenants_paymob_auto_enroll_after_insert/i);
            assert.match(automaticRolloutMigration,/after\s+insert\s+on\s+core\.tenants/i);
            assert.match(automaticRolloutMigration,/automatic_all_tenants/i);
            assert.match(automaticRolloutMigration,/v_enabled\s*<>\s*v_tenants/i);
            assert.doesNotMatch(automaticRolloutMigration,/modaar-training-center/);
            assert.doesNotMatch(automaticRolloutMigration,/v_order\.total_minor\s*>\s*50000/i);
            assert.doesNotMatch(ui,/500 ر\.س|Reef Skills مستبعد/i);
            assert.match(ui,/automaticTenantEnrollment/i);
            assert.match(ui,/controlledLiveActive/i);
            assert.match(ui,/كل المنشآت الحالية والجديدة/i);
          });

          '''
          live = replace_between(
              live, live_start, live_end, live_replacement,
              'legacy one-tenant live validation test',
          )
          historical_start = "test('legacy unsafe canary is disabled and Reef remains untouched',()=>{"
          historical_replacement = r'''test('historical canary evidence is preserved while the new policy is explicit and auditable',()=>{
            assert.match(migration,/live_canary_reapproval_required/i);
            assert.match(migration,/'globalLiveActivated',false/i);
            assert.match(automaticRolloutMigration,/Compatibility alias retained for older audited payment functions/i);
            assert.match(automaticRolloutMigration,/marketplace\.paymob\.automatic_tenant_rollout_enabled/i);
            assert.match(automaticRolloutMigration,/fullOperationalEvidenceStillRequired',true/i);
            assert.match(automaticRolloutMigration,/secretReturned',false/i);
            assert.doesNotMatch(automaticRolloutMigration,/update\s+marketplace\.payment_provider_configs/i);
          });
          '''
          historical_index = live.find(historical_start)
          if historical_index < 0:
              raise SystemExit('historical canary test start marker missing')
          live = live[:historical_index] + historical_replacement
          live_path.write_text(live, encoding='utf-8')
          PY

      - name: Prove the exact bounded release surface
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/api/platform/paymob-control/route.js \
            components/platform-addon-console.js \
            tests/paymob-admin-governance.test.mjs \
            tests/paymob-live-validation-v2.test.mjs | sort)"
          test "$changed" = "$expected" || {
            echo 'Unexpected files changed:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          grep -Fq 'automaticTenantEnrollment:value.automaticTenantEnrollment===true' app/api/platform/paymob-control/route.js
          grep -Fq 'controlledLiveActive:value.controlledLiveActive===true' app/api/platform/paymob-control/route.js
          grep -Fq 'SINGLE AUTHORIZED OPERATOR · AUTOMATIC TENANT ENROLLMENT' components/platform-addon-console.js
          grep -Fq 'كل المنشآت الحالية والجديدة' components/platform-addon-console.js
          grep -Fq "const [environment,setEnvironment]=useState('live');" components/platform-addon-console.js
          grep -Fq 'controlled Live automatically enrolls every existing and future tenant' tests/paymob-live-validation-v2.test.mjs
          grep -Fq 'zz_tenants_paymob_auto_enroll_after_insert' supabase/migrations/20260905170000_paymob_automatic_all_tenants_v1.sql
          grep -Fq 'paymob_automatic_rollout_postflight_failed' supabase/migrations/20260905170000_paymob_automatic_all_tenants_v1.sql

      - name: Install immutable dependencies
        run: npm ci

      - name: Run the complete engineering quality gate
        run: npm run check

      - name: Reject critical dependency advisories
        run: npm audit --audit-level=critical

      - name: Commit verified implementation and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/paymob-auto-all-tenants-build.yml \
            .github/workflows/paymob-auto-all-tenants-build-v2.yml
          git add \
            app/api/platform/paymob-control/route.js \
            components/platform-addon-console.js \
            tests/paymob-admin-governance.test.mjs \
            tests/paymob-live-validation-v2.test.mjs
          git commit -m 'feat(paymob): automate availability for all tenants'
          git push origin HEAD:feat/paymob-auto-all-tenants-20260905
