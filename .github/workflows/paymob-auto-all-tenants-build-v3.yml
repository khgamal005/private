name: Finalize Paymob automatic all-tenant rollout

on:
  push:
    branches:
      - feat/paymob-auto-all-tenants-20260905
    paths:
      - .github/workflows/paymob-auto-all-tenants-build-v3.yml

permissions:
  contents: write

concurrency:
  group: paymob-auto-all-tenants-build-v3
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paymob-auto-all-tenants-20260905
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reuse the reviewed builder with semantically precise migration assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow=Path('.github/workflows/paymob-auto-all-tenants-build-v2.yml').read_text(encoding='utf-8')
          start_marker="          python3 - <<'PY'\n"
          end_marker="\n          PY\n"
          start=workflow.find(start_marker)
          end=workflow.find(end_marker,start+len(start_marker))
          if start<0 or end<0:
              raise SystemExit('reviewed v2 builder block is unavailable')
          code=textwrap.dedent(workflow[start+len(start_marker):end])

          old_one="            assert.doesNotMatch(automaticRolloutMigration,/modaar-training-center/);"
          old_two="            assert.doesNotMatch(automaticRolloutMigration,/v_order\\.total_minor\\s*>\\s*50000/i);"
          new=(
              "            assert.match(automaticRolloutMigration,/paymob_automatic_rollout_prepare_patch_failed/i);\n"
              "            assert.match(automaticRolloutMigration,/paymob_automatic_rollout_action_patch_failed/i);\n"
              "            assert.match(automaticRolloutMigration,/position\\('modaar-training-center' in v_definition\\) > 0/i);\n"
              "            assert.match(automaticRolloutMigration,/position\\('paymob_live_canary_amount_limit' in v_definition\\) > 0/i);"
          )
          if code.count(old_one)!=1 or code.count(old_two)!=1:
              raise SystemExit('legacy broad migration assertions are unavailable or ambiguous')
          code=code.replace(old_one,new,1).replace(old_two,'',1)
          exec(compile(code,'<paymob-auto-all-tenants-reviewed-builder>','exec'),{})
          PY

      - name: Prove the exact bounded release surface and policy
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/api/platform/paymob-control/route.js \
            components/platform-addon-console.js \
            tests/paymob-admin-governance.test.mjs \
            tests/paymob-live-validation-v2.test.mjs | sort)"
          test "$changed" = "$expected" || {
            echo 'Unexpected files changed:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          grep -Fq 'automaticTenantEnrollment:value.automaticTenantEnrollment===true' app/api/platform/paymob-control/route.js
          grep -Fq 'controlledLiveActive:value.controlledLiveActive===true' app/api/platform/paymob-control/route.js
          grep -Fq 'SINGLE AUTHORIZED OPERATOR · AUTOMATIC TENANT ENROLLMENT' components/platform-addon-console.js
          grep -Fq 'كل المنشآت الحالية والجديدة' components/platform-addon-console.js
          grep -Fq "const [environment,setEnvironment]=useState('live');" components/platform-addon-console.js
          grep -Fq 'paymob_automatic_rollout_postflight_failed' supabase/migrations/20260905170000_paymob_automatic_all_tenants_v1.sql
          grep -Fq 'zz_tenants_paymob_auto_enroll_after_insert' supabase/migrations/20260905170000_paymob_automatic_all_tenants_v1.sql
          grep -Fq 'controlled Live automatically enrolls every existing and future tenant' tests/paymob-live-validation-v2.test.mjs
          grep -Fq "position\\('modaar-training-center' in v_definition\\) > 0" tests/paymob-live-validation-v2.test.mjs

      - name: Install immutable dependencies
        run: npm ci

      - name: Run the complete engineering quality gate
        run: npm run check

      - name: Reject critical dependency advisories
        run: npm audit --audit-level=critical

      - name: Commit the verified release and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/paymob-auto-all-tenants-build.yml \
            .github/workflows/paymob-auto-all-tenants-build-v2.yml \
            .github/workflows/paymob-auto-all-tenants-build-v3.yml
          git add \
            app/api/platform/paymob-control/route.js \
            components/platform-addon-console.js \
            tests/paymob-admin-governance.test.mjs \
            tests/paymob-live-validation-v2.test.mjs
          git commit -m 'feat(paymob): automate availability for all tenants'
          git push origin HEAD:feat/paymob-auto-all-tenants-20260905
