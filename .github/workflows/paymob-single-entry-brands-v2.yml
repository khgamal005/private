name: Verify Paymob single-entry checkout UX v2

on:
  push:
    branches:
      - feat/paymob-single-entry-brands-v2-20260905
    paths:
      - .github/workflows/paymob-single-entry-brands-v2.yml
      - .github/scripts/apply-paymob-single-entry-brands-v2.py

permissions:
  contents: write

concurrency:
  group: paymob-single-entry-brands-v2-20260905
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paymob-single-entry-brands-v2-20260905
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply bounded checkout UX patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-paymob-single-entry-brands-v2.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path('components/marketplace-store.module.css')
          path.write_text(path.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')
          PY

      - name: Prove narrow change surface and static contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            app/api/payments/paymob/checkout/route.js \
            components/marketplace-addon-store-v2.js \
            components/marketplace-store.js \
            components/marketplace-store.module.css \
            components/payment-method-picker.js \
            public/payment-brands/amex.svg \
            public/payment-brands/apple-pay.svg \
            public/payment-brands/mada.svg \
            public/payment-brands/mastercard.svg \
            public/payment-brands/visa.svg \
            tests/paymob-checkout-ui.test.mjs | sort)"
          test "$changed" = "$expected" || {
            echo 'Unexpected change surface:' >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$changed") || true
            exit 1
          }
          ! grep -R "PaymobBillingFields\|billingFirstName\|billingContact:billingContact" \
            components/marketplace-addon-store-v2.js components/marketplace-store.js
          grep -Fq 'billingContact:checkoutCompatibilityContact(orderId)' \
            app/api/payments/paymob/checkout/route.js
          grep -Fq '/payment-brands/mada.svg' components/payment-method-picker.js
          grep -Fq '/payment-brands/apple-pay.svg' components/payment-method-picker.js
          test "$(find public/payment-brands -maxdepth 1 -type f -name '*.svg' | wc -l)" -eq 5
          ! grep -R -E '<(script|foreignObject|iframe)\b' public/payment-brands

      - name: Persist candidate for inspectable failure recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/api/payments/paymob/checkout/route.js \
            components/marketplace-addon-store-v2.js \
            components/marketplace-store.js \
            components/marketplace-store.module.css \
            components/payment-method-picker.js \
            public/payment-brands \
            tests/paymob-checkout-ui.test.mjs
          git commit -m 'feat(payments): simplify Paymob checkout and show payment brands'
          git push origin HEAD:feat/paymob-single-entry-brands-v2-20260905

      - name: Install immutable dependencies
        run: npm ci

      - name: Run complete quality gate
        run: npm run check

      - name: Reject critical dependency advisories
        run: npm audit --audit-level=critical

      - name: Remove one-time automation after verification
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/paymob-single-entry-brands-v2.yml \
            .github/scripts/apply-paymob-single-entry-brands-v2.py
          git commit -m 'chore: remove one-time Paymob checkout automation'
          git push origin HEAD:feat/paymob-single-entry-brands-v2-20260905
