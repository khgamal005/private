name: Refine native template layout

on:
  push:
    branches:
      - agent/fix-native-template-layout-delete
    paths:
      - scripts/refine-native-template-layout.mjs
      - .github/workflows/refine-native-template-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-native-template-layout-delete
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/refine-native-template-layout.mjs
      - run: |
          git config user.name "Marktone Builder Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refine nested scroll detection and template actions"
          git push origin HEAD:agent/fix-native-template-layout-delete
