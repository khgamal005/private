name: Unpack MarkeTone CMS bundle

on:
  push:
    branches:
      - agent/marktone-public-site-cms

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ !contains(github.event.head_commit.message, '[cms-unpacked]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/marktone-public-site-cms
          fetch-depth: 0
      - name: Expand CMS source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .cms-bundle/chunk-* | base64 --decode > /tmp/marktone-cms.tar.gz
          tar -xzf /tmp/marktone-cms.tar.gz -C .
          rm -rf .cms-bundle
          rm -f .github/workflows/unpack-cms.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add managed MarkeTone public website [cms-unpacked]"
          git push origin HEAD:agent/marktone-public-site-cms
