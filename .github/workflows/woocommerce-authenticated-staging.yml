name: ODEIR WooCommerce authenticated staging
on:
  push:
    branches: ['fix/woocommerce-beneficiaries']
    paths:
      - '.github/workflows/woocommerce-authenticated-staging.yml'
      - 'scripts/releases/verify-woocommerce-authenticated-staging.mjs'
permissions:
  contents: read
concurrency:
  group: woocommerce-authenticated-staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify real signed-in roles through Next and staging RPCs
        env:
          # Account-management token aliases used by the existing release workflow.
          # The script accepts ONLY platform-Staging; it never calls production.
          ODEIR_STAGING_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN || secrets.PROD_SUPABASE_ACCESS_TOKEN }}
        run: node scripts/releases/verify-woocommerce-authenticated-staging.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: woocommerce-authenticated-staging-evidence
          path: /tmp/woocommerce-authenticated-staging-evidence.json
          retention-days: 3
