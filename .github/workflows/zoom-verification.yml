name: Zoom isolated verification
on:
  push:
    branches: [feat/zoom-multi-account]
  pull_request:
    paths: ['**/*zoom*', 'supabase/functions/zoom-connect/**', 'docs/zoom/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zoom_ci
          POSTGRES_PASSWORD: zoom_disposable_test
          POSTGRES_DB: zoom_concurrency
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zoom_ci -d zoom_concurrency"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ZOOM_TEST_DATABASE_URL: postgres://zoom_ci:zoom_disposable_test@127.0.0.1:5432/zoom_concurrency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts pg@8.16.3
      - run: git diff --exit-code -- package.json package-lock.json
      # Keep the PR closed while preview integrations are under review. Run the
      # whole ODEIR quality gate on this protected feature branch, without deploy.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migration:verify
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: synthetic-build-only
          SUPABASE_URL: http://127.0.0.1:54321
