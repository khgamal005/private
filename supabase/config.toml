project_id = "marktone-platform-control"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false
sql_paths = []

[functions.training-automation-dispatch]
verify_jwt = false

[functions.woocommerce-sync]
# User actions validate the bearer token through tenant-scoped RPCs, while the
# scheduled dispatcher authenticates with its own Vault-backed secret.
verify_jwt = false

[functions.commerce-sync]
# The function validates user JWTs through tenant-scoped RPCs and uses the
# project secret key only for Vault-backed connector execution.
verify_jwt = false

[functions.ads-sync]
# Manual requests are authorized by tenant-scoped RPCs. Scheduled requests
# require a dedicated server-side dispatcher secret before service RPC access.
verify_jwt = false

[functions.knowledge-ingest]
# Scheduled runs use a Vault-backed secret; manual runs verify the platform
# administrator JWT inside the function before reading any configured source.
verify_jwt = false

[functions.tenant-invitation-activation]
# The one-time invitation token is the custom bearer credential for activation.
verify_jwt = false

[functions.platform-invitation-activation]
# The one-time platform invitation token is validated by a narrow preview RPC.
verify_jwt = false

[functions.tenant-staff-password-reset]
verify_jwt = true

[functions.support-attachment-cleanup]
# Scheduled maintenance authenticates with its dedicated server-side cron
# secret before using the service role for the two narrow cleanup RPCs.
verify_jwt = false

[functions.payment-provider-admin]
# Caller JWT is checked by the gateway and again through the canonical
# platform.billing.manage snapshot before any service-role Vault operation.
verify_jwt = true

[functions.marketplace-payment-webhook]
# Legacy internal Marktone HMAC channel only. It remains JWT-free for its
# server-to-server signer and must never proxy or receive native Paymob events.
verify_jwt = false

[functions.paymob-checkout]
# The gateway requires the customer's JWT. The function then authorizes the
# exact tenant/order through a caller-scoped RPC before any Paymob request.
verify_jwt = true

[functions.paymob-webhook]
# Paymob cannot send a Supabase JWT. This endpoint accepts only the native
# TRANSACTION callback after exact HMAC-SHA512 verification in the function.
verify_jwt = false

[functions.paymob-reconcile]
# Scheduled runs authenticate with a dedicated dispatcher secret; manual runs
# require a platform billing administrator JWT, both rechecked in the function.
verify_jwt = false

[functions.odeir-registration-intake]
# Public registration uses a server-to-server ingress token. The browser never
# receives either this token or the service-role key.
verify_jwt = false

[functions.odeir-registration-manual-activation]
# Only an authenticated platform reviewer can enter this gateway. Canonical
# database permission checks still run inside every user-scoped RPC.
verify_jwt = true


[functions.tamara-checkout]
verify_jwt = true

[functions.tamara-webhook]
# Native Tamara HS256 token is verified internally; it is not a Supabase JWT.
verify_jwt = false

[functions.tamara-reconcile]
# Dedicated dispatcher token is verified in Vault; manual service JWTs use RPC auth.
verify_jwt = false

[functions.tamara-setup]
verify_jwt = true
